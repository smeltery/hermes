name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: flox/install-flox-action@5bb9eaaffbeaa699a8251a1ae21ecf4c8e0e37d4 # v2
        with:
          version: 1.18.2
      - run: flox activate -- bun install --frozen-lockfile
      - run: flox activate -- bash scripts/check.sh
      - run: flox activate -- bash scripts/release.sh
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes
          fi
          if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != true ]; then
            echo 'Release is already published; refusing to replace immutable assets'
            exit 0
          fi
          gh release upload "$RELEASE_TAG" "dist/hermes-$RELEASE_TAG.tar.gz" dist/SHA256SUMS --clobber
          mkdir -p dist/verify
          gh release download "$RELEASE_TAG" --dir dist/verify
          (cd dist/verify && sha256sum --check SHA256SUMS)
          test "$(find dist/verify -maxdepth 1 -type f | wc -l)" -eq 2
          gh release edit "$RELEASE_TAG" --draft=false
