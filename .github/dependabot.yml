version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    # The starter supports Spring Boot 3; a new major needs a separate migration.
    ignore:
      - dependency-name: 'org.springframework.boot:*'
        update-types: ['version-update:semver-major']
    groups:
      java-dependencies:
        patterns: ['*']
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    # Tailwind 4 changes the styling pipeline and needs a visual migration.
    ignore:
      # typescript-eslint requires the TypeScript 6 API.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: tailwindcss
        update-types: ['version-update:semver-major']
    groups:
      javascript-dependencies:
        patterns: ['*']
